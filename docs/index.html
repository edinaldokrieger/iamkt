além de implementar ferramentas - envolve medir, analisar e ajustar constantemente."},{"kind":"paragraph","text":"Não existe estratégia de IA que funcione no “piloto automático” sem acompanhamento. O ganho real vem da capacidade de aprender com os dados e evoluir continuamente. A IA acelera muito esse processo. O que antes era manual e demorado passa a acontecer quase em tempo real: dashboards destacam pontos fora do padrão, ferramentas sugerem melhorias e campanhas podem ser ajustadas automaticamente. Isso amplia a capacidade de análise, mas não elimina a necessidade de interpretação. E aqui está um ponto crítico: IA apoia decisões, mas não decide sozinha com contexto completo. Nem sempre ela considera fatores de negócio, posicionamento de marca ou nuances do público. Por isso, confiar cegamente nas recomendações pode ser tão problemático quanto não usar IA. O equilíbrio entre análise automatizada e julgamento humano é o que gera melhores resultados. Outro aprendizado importante é que métricas só têm valor quando geram ação. Acompanhar números sem tomar decisões não traz resultado. Já quando existe um ciclo contínuo de medir, analisar, agir e ajustar, o impacto se torna consistente e escalável ao longo do tempo. Até aqui, você viu como a IA pode potencializar decisões e resultados no marketing. Mas existe um ponto fundamental que não pode ser ignorado: o uso responsável dessas tecnologias. No próximo e último tópico, você vai entender como aplicar IA no marketing respeitando princípios éticos, privacidade de dados e a LGPD, garantindo não apenas performance, mas também confiança e sustentabilidade nas estratégias."}]}],"quiz":{"question":"Qual é o primeiro passo para avaliar resultados de marketing com IA?","options":["Definir a pergunta e os KPIs ligados ao objetivo","Escolher qualquer métrica disponível","Tratar uma correlação como prova de causa"],"correct":0,"feedback":["Correto. A análise começa pela pergunta e por indicadores ligados à meta.","A métrica precisa responder ao objetivo específico da campanha.","Padrões observados devem ser investigados; correlação não prova causa."]}},{"id":6,"title":"Ética, privacidade e LGPD na utilização de IA em marketing","units":[{"title":"Panorama do módulo","blocks":[{"kind":"paragraph","text":"Introdução do tópico O uso da Inteligência Artificial no marketing traz inúmeras oportunidades, mas também levanta questões importantes relacionadas à ética e ao uso de dados. À medida que as empresas passam a coletar e analisar grandes volumes de informações, cresce a responsabilidade sobre como esses dados são utilizados. Privacidade deixou de ser apenas uma preocupação legal e passou a ser um fator central na relação de confiança com o cliente. Consumidores estão cada vez mais atentos a como suas informações são coletadas, armazenadas e utilizadas pelas empresas. Além disso, o uso inadequado da IA pode gerar problemas como discriminação algorítmica, falta de transparência e até desinformação. Esses riscos não apenas afetam os resultados das campanhas, mas também podem impactar diretamente a reputação da marca. Neste tópico, você vai entender os principais aspectos éticos e legais relacionados ao uso da IA no marketing, incluindo a LGPD, boas práticas de transparência e como utilizar a tecnologia de forma responsável e sustentável."}]},{"title":"6.1 Vieses Algorítmicos","blocks":[{"kind":"paragraph","text":"À medida que a Inteligência Artificial se torna mais presente no marketing digital, surge um desafio crítico: garantir que as decisões automatizadas sejam justas e éticas. Embora a IA seja frequentemente vista como neutra, ela pode reproduzir, e até amplificar, desigualdades existentes. Os vieses algorítmicos não são apenas um problema técnico, mas também estratégico e ético. Identificá-los e corrigi-los é essencial para garantir campanhas mais eficazes, inclusivas e sustentáveis."},{"kind":"heading","text":"6.1.1 Identificação de Vieses"},{"kind":"paragraph","text":"Vieses algorítmicos ocorrem quando sistemas de IA produzem decisões que favorecem ou prejudicam sistematicamente determinados grupos. Diferente de vieses humanos, que podem ser inconsistentes, os vieses algorítmicos tendem a ser escaláveis e repetitivos, impactando grandes volumes de pessoas. Os vieses algorítmicos surgem de múltiplas fontes:"},{"kind":"paragraph","text":"desigualdades."},{"kind":"paragraph","text":"proxy para atributos sensíveis."},{"kind":"paragraph","text":"Exemplos de Vieses Algorítmicos em Marketing:"},{"kind":"paragraph","text":"diferente para homens e mulheres baseado em estereótipos. Mulheres recebem recomendações de produtos de beleza e moda, homens recebem recomendações de tecnologia e esportes."},{"kind":"paragraph","text":"grupos raciais. Estudos descobriram que algoritmos de preço dinâmico frequentemente cobram mais de grupos minoritários."},{"kind":"paragraph","text":"piores para pessoas de bairros mais pobres, mesmo que tenham perfil de crédito similar a pessoas de bairros ricos."},{"kind":"paragraph","text":"interessadas em tecnologia, oferecendo recomendações diferentes baseado em idade."},{"kind":"heading","text":"6.1.2 Impacto em Campanhas de Marketing"},{"kind":"paragraph","text":"Os vieses algorítmicos em marketing têm impactos práticos e prejudiciais. Primeiro, reduzem a efetividade de campanhas."},{"kind":"paragraph","text":"Se você está excluindo sistematicamente certos grupos de pessoas de suas campanhas devido a viés, você está deixando dinheiro na mesa. Você não está atingindo clientes potenciais que poderiam estar interessados em seus produtos. Além disso, os vieses causam dano direto aos clientes. Se uma mulher não recebe recomendação de um produto que seria perfeito para ela porque o algoritmo assume que mulheres não estão interessadas, ela é prejudicada. Se uma pessoa de um bairro mais pobre é cobrada mais por um produto devido a viés, ela é prejudicada. Por fim, vieses prejudicam a reputação da marca. Se clientes descobrem que sua empresa está usando IA de forma discriminatória, isso pode levar a backlash público, perda de confiança e até ação legal. Como Identificar Vieses:"},{"kind":"paragraph","text":"para diferentes grupos demográficos. Se um grupo tem performance significativamente diferente, pode haver viés."},{"kind":"paragraph","text":"veja se o comportamento é similar. Se o modelo recomenda produtos diferentes para homens e mulheres com perfis similares, há viés."},{"kind":"paragraph","text":"representação adequada de diferentes grupos? Se seus dados são 80% homens e 20% mulheres, seu modelo pode ser enviesado contra mulheres."},{"kind":"paragraph","text":"características que funcionam como proxy para características protegidas (como raça ou gênero)?"},{"kind":"paragraph","text":"reclamam que estão recebendo tratamento injusto, isso é sinal de viés."}]},{"title":"6.2 Transparência no Uso de IA","blocks":[{"kind":"paragraph","text":"Além de evitar vieses, empresas precisam ser claras sobre como utilizam Inteligência Artificial. A transparência deixou de ser um diferencial e passou a ser uma expectativa dos consumidores."},{"kind":"heading","text":"6.2.1 Comunicação com Usuários"},{"kind":"paragraph","text":"Transparência significa ser claro com clientes sobre quando e como você está usando IA. Muitos clientes não sabem que estão interagindo com IA. Um chatbot que não se identifica como IA, um anúncio gerado por IA que não é identificado como tal, uma recomendação de produto gerada por IA que não é transparente, tudo isso é falta de transparência. A falta de transparência prejudica confiança. Estudos mostram que quando clientes descobrem que estavam interagindo com IA sem saber, sua confiança na marca diminui significativamente. Por outro lado, quando empresas são transparentes sobre uso de IA, clientes tendem a ser mais receptivos. Transparência também é importante para permitir que clientes façam escolhas informadas. Se um cliente sabe que uma recomendação de produto foi gerada por IA, ele pode considerar isso ao tomar sua decisão. Se ele não sabe, está sendo manipulado. Boas Práticas de Transparência:"},{"kind":"paragraph","text":"assistente de IA” ou “Esta recomendação foi gerada por IA” são comunicações claras."},{"kind":"paragraph","text":"conclusão. “Esta recomendação foi baseada em seu histórico de compra” é mais transparente que apenas mostrar a recomendação."},{"kind":"paragraph","text":"preferirem. Ofereça alternativas. “Prefere falar com um agente humano?” oferece controle."},{"kind":"paragraph","text":"chatbot pode responder perguntas simples, mas para questões complexas, você será transferido para um agente” é honesto."},{"kind":"paragraph","text":"como estão sendo usados. “Usamos seu histórico de compra para gerar recomendações personalizadas” é mais transparente que coletar dados silenciosamente."},{"kind":"heading","text":"6.2.2 Disclosure e Confiança"},{"kind":"paragraph","text":"Disclosure é a prática de divulgação explícita do uso de IA e do tratamento de dados. No contexto de IA, disclosure significa revelar quando IA está sendo usada, como está sendo usada, e quais dados estão sendo processados. Disclosure é importante não apenas por razões éticas, mas também legais. Regulamentações como LGPD e GDPR exigem disclosure. Você deve informar aos clientes que está coletando dados, para qual propósito, e como estão sendo processados. Mas além de conformidade legal, disclosure constrói confiança. Clientes que sabem que você está sendo transparente sobre IA e dados tendem a confiar mais em você. Clientes que descobrem que você estava usando IA ou coletando dados sem informá-los tendem a confiar menos. Um exemplo: recomendações com mensagens como “baseado no seu histórico” aumentam a percepção de transparência e credibilidade."}]},{"title":"6.3 Riscos de Desinformação","blocks":[{"kind":"paragraph","text":"A capacidade da IA de gerar conteúdo em escala trouxe ganhos de produtividade, mas também abriu espaço para riscos importantes, especialmente relacionados à veracidade das informações, sendo que um dos maiores riscos de IA em marketing é a geração de desinformação. Ferramentas de geração de conteúdo com IA podem criar textos, imagens e até vídeos que parecem autênticos, mas são completamente falsos. Isso é particularmente perigoso em marketing porque pode ser usado para enganar clientes."},{"kind":"heading","text":"6.3.1 Fake News e Conteúdo Falso"},{"kind":"paragraph","text":"Ferramentas de IA podem gerar conteúdos altamente realistas, mas nem sempre verdadeiros. Exemplos de desinformação gerada por IA:"},{"kind":"paragraph","text":"A desinformação prejudica clientes que são enganados, prejudica a reputação da marca quando descoberta, e prejudica a sociedade ao contribuir para erosão de confiança em informação."},{"kind":"heading","text":"6.3.2 Responsabilidade do Marketer"},{"kind":"paragraph","text":"O uso responsável da IA depende diretamente da atuação humana. Como marketer, você tem responsabilidade de não gerar ou disseminar desinformação. Isso significa:"},{"kind":"paragraph","text":"(estatísticas, datas, nomes), verifique em fontes confiáveis antes de publicar."},{"kind":"paragraph","text":"quer depoimentos, use depoimentos reais de clientes reais."},{"kind":"paragraph","text":"claro. “Imagem gerada por IA para fins ilustrativos” é honesto."},{"kind":"paragraph","text":"disseram. Isso é enganoso e potencialmente ilegal."},{"kind":"paragraph","text":"contexto. “Este artigo foi escrito com suporte de IA” é mais honesto que apresentar como se fosse escrito por humano."},{"kind":"paragraph","text":"conteúdo falso. Isso constrói confiança e responsabilidade social. Por exemplo, uma empresa de marketing pode usar a IA para gerar ideias de conteúdo. Mas antes de publicar qualquer conteúdo, um humano revisa, verifica fatos, e garante que tudo é preciso e honesto. Isso combina eficiência de IA com responsabilidade humana. A IA potencializa a criação de conteúdo, mas exige responsabilidade proporcional. O papel do profissional de marketing é garantir que eficiência não comprometa a verdade."}]},{"title":"6.4 Uso Responsável e Conformidade com Regulamentações","blocks":[{"kind":"paragraph","text":"O uso de IA no marketing envolve diretamente o tratamento de dados pessoais. Por isso, além de boas práticas éticas, é essencial seguir regulamentações como a LGPD e o"},{"kind":"heading","text":"GDPR."},{"kind":"heading","text":"6.4.1 LGPD e GDPR"},{"kind":"paragraph","text":"LGPD (Lei Geral de Proteção de Dados) é a lei de proteção de dados do Brasil. GDPR (General Data Protection Regulation) é a lei da Europa. Embora com diferenças, ambas estabelecem princípios similares sobre como dados pessoais devem ser tratados. Princípios Principais de LGPD:"},{"kind":"paragraph","text":"de coletar ou processar dados pessoais. Consentimento não pode ser presumido - deve ser ativo e informado."},{"kind":"paragraph","text":"específicas. Não pode coletar dados “para fins gerais” e depois usar para qualquer coisa."},{"kind":"paragraph","text":"coletando, para qual finalidade, e como estão sendo processados."},{"kind":"paragraph","text":"ou roubo."},{"kind":"paragraph","text":"como estão sendo usados."},{"kind":"paragraph","text":"deletados."},{"kind":"paragraph","text":"formato estruturado e portá-los para outro serviço. Implicações para Marketing com IA: Quando você usa IA em marketing, você frequentemente está processando dados pessoais. Um sistema de recomendação de produtos processa dados de histórico de compra. Um chatbot processa dados de conversas. Um sistema de segmentação processa dados demográficos. Tudo isso é regulado por LGPD. Conformidade com LGPD em marketing com IA significa:"},{"kind":"paragraph","text":"consentimento explícito do cliente."},{"kind":"paragraph","text":"coletando dados. “Usaremos seus dados para gerar recomendações personalizadas” é específico. “Usaremos seus dados para fins de marketing” é vago."},{"kind":"paragraph","text":"contesta, você precisa provar que obteve consentimento."},{"kind":"paragraph","text":"dados. Isso inclui criptografia, controle de acesso, e auditoria."},{"kind":"paragraph","text":"respeite o pedido."},{"kind":"paragraph","text":"pode precisar designar um Data Protection Officer (DPO) que é responsável por conformidade."},{"kind":"heading","text":"6.4.2 Conformidade e Boas Práticas"},{"kind":"paragraph","text":"Conformidade com regulamentações é o mínimo. Boas práticas vão além de conformidade legal e refletem compromisso genuíno com ética e responsabilidade. Boas Práticas de Uso Responsável de IA em Marketing:"},{"kind":"paragraph","text":"identificar vieses, problemas de segurança, ou outros problemas."},{"kind":"paragraph","text":"diversos e representativos. Não treine modelos apenas em dados de um grupo demográfico."},{"kind":"paragraph","text":"diversas ajudam a identificar problemas que uma perspectiva única poderia perder."},{"kind":"paragraph","text":"dados usam, quais são suas limitações. Isso ajuda em auditoria e conformidade."},{"kind":"paragraph","text":"não estão discriminando certos grupos."},{"kind":"paragraph","text":"problemas com IA. Se um cliente acha que foi tratado injustamente, ouça e investigue."},{"kind":"paragraph","text":"entendem importância de usar IA responsavelmente."},{"kind":"paragraph","text":"clientes, mas também com investidores, reguladores, e público sobre como você está usando IA. Conformidade não deve ser vista como limitação, mas como base para um uso sustentável da IA. Empresas que tratam dados com responsabilidade constroem vantagem competitiva e relações mais sólidas com seus clientes."},{"kind":"heading","text":"Considerações do tópico"},{"kind":"paragraph","text":"Você aprendeu neste tópico que ética e responsabilidade não são obstáculos ao uso de IA em marketing - são fundações essenciais. Empresas que usam IA de forma responsável, transparente e ética constroem confiança com clientes, evitam problemas legais, e contribuem para uma sociedade melhor. Os desafios éticos de IA são reais. Vieses algorítmicos podem levar a discriminação. Falta de transparência pode enganar clientes. Desinformação pode prejudicar sociedade. Não conformidade com regulamentações pode resultar em multas e ação legal. Mas todos esses desafios podem ser gerenciados com diligência, responsabilidade e compromisso com ética. Você também aprendeu que conformidade legal é apenas o começo. Boas práticas vão além de conformidade e refletem compromisso genuíno com fazer a coisa certa. Empresas que implementam boas práticas ganham vantagem competitiva - clientes confiam mais, reguladores são mais receptivos, e equipes estão mais engajadas. Finalmente, você aprendeu que responsabilidade é compartilhada. Não é apenas responsabilidade de executivos ou departamento de compliance. É responsabilidade de cada marketer, cada desenvolvedor, cada pessoa que trabalha com IA. Cada decisão que você toma - qual dado coletar, como treinar um modelo, como comunicar com clientes - tem implicações éticas. Tome essas decisões com cuidado e responsabilidade."}]}],"quiz":{"question":"Qual prática combina transparência e controle para o cliente?","options":["Identificar o uso de IA, explicar o uso de dados e oferecer alternativa quando possível","Ocultar que o atendimento é automatizado","Coletar dados para finalidades vagas e decidir depois como usá-los"],"correct":0,"feedback":["Correto. O material recomenda transparência, explicação e opções de controle.","O material alerta que falta de transparência pode prejudicar a confiança.","A finalidade deve ser específica e comunicada com clareza."]}}],"conclusion":["Ao longo deste curso, você aprendeu uma jornada completa de IA em marketing, desde fundamentos até implementação responsável. Você começou compreendendo os Fundamentos de IA no Marketing - o que é IA, como evoluiu, e quais são os tipos principais (generativa, preditiva, analítica) e multimodal. Você aprendeu que IA não é magia, mas uma tecnologia bem estabelecida com décadas de pesquisa por trás. Você então explorou Aplicações de IA em Estratégias de Marketing Digital - como IA transforma cada aspecto do marketing, desde personalização e segmentação até marketing conversacional, automação e análise comportamental. Você viu que IA não é apenas mais eficiente, mas habilita estratégias completamente novas. Você conheceu as Ferramentas Introdutórias de IA - ferramentas práticas e acessíveis que você pode usar hoje para implementar IA em suas campanhas. De geração de conteúdo até análise de dados e automação, você aprendeu quais ferramentas existem e quando usá-las. Você dominou Prompt Engineering para Marketing - a habilidade crítica de comunicar-se efetivamente com sistemas de IA. Você aprendeu técnicas de estruturação de prompts, boas práticas de refinamento, e como contornar limitações de IA. Você aprendeu a medir sucesso através de Métricas e Análise de Resultados com Suporte da IA - como identificar KPIs importantes, como IA otimiza essas métricas, e como extrair insights acionáveis de dados. E finalmente, você aprendeu a usar IA de forma Ética, Responsável e em Conformidade com Regulamentações - compreendendo vieses, transparência, riscos de desinformação, e como estar em conformidade com LGPD e outras regulamentações. Este conhecimento o prepara para implementar IA em marketing de forma estratégica, prática e responsável. Você não apenas compreende IA, mas sabe como usá-","la para gerar valor para sua empresa enquanto respeita direitos e dignidade de seus clientes. O futuro do marketing é IA. Empresas que dominam IA crescem mais rápido, geram melhores resultados, e conquistam vantagem competitiva. Mas empresas que usam IA de forma irresponsável enfrentam backlash, problemas legais, e perda de confiança. A diferença está em conhecimento, responsabilidade e execução. Você agora tem esse conhecimento. Use-o bem. Implemente IA em suas campanhas. Meça resultados. Otimize continuamente. E faça tudo isso de forma ética e responsável."]}</script>
<script>
// Course text and activities are loaded from the PDF-based data block above.
const COURSE=JSON.parse(document.getElementById('courseData').textContent);
const storageKey='iamkt_lms_progress_v1';
const steps=[{type:'welcome'}];
COURSE.modules.forEach((module,mi)=>{module.units.forEach((unit,ui)=>steps.push({type:'lesson',mi,ui}));steps.push({type:'quiz',mi})});
steps.push({type:'complete'});
const initial=()=>({current:0,maxUnlocked:0,visited:{},passed:{},answers:{},firstTry:{}});
let state=initial(),storageAvailable=true;
try{const raw=localStorage.getItem(storageKey);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')state={...initial(),...parsed,visited:parsed.visited||{},passed:parsed.passed||{},answers:parsed.answers||{},firstTry:parsed.firstTry||{}}}}catch(e){storageAvailable=false}
let savedAtOpen=state.current,resumeAvailable=state.maxUnlocked>0||Object.keys(state.passed).length>0;
const screen=document.getElementById('screen'),nav=document.getElementById('moduleNav'),progress=document.getElementById('progress');
function save(){if(!storageAvailable)return;try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){storageAvailable=false;document.getElementById('storageNote').hidden=false;document.getElementById('storageNote').textContent='Não foi possível salvar seu progresso neste navegador. A trilha continua funcionando nesta sessão.';document.getElementById('saveStatus').textContent='O progresso desta sessão não pôde ser salvo.'}}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function actionButton(label,cls,fn,disabled=false){const b=el('button','btn '+(cls||''),label);b.type='button';b.disabled=disabled;b.addEventListener('click',fn);return b}
function addParagraphs(parent,texts){texts.forEach(text=>parent.append(el('p','',text)))}
function updateProgress(){const max=steps.length-1;const visited=Object.keys(state.visited).filter(k=>state.visited[k]).length;const pct=Math.round(visited/steps.length*100);progress.value=pct;progress.textContent=pct+'%';document.getElementById('percent').textContent=pct+'%';document.getElementById('topBar').style.width=pct+'%';document.getElementById('stepCount').textContent=`Etapa ${Math.min(state.current+1,steps.length)} de ${steps.length}`}
function renderNav(){nav.replaceChildren();COURSE.modules.forEach((m,mi)=>{const li=document.createElement('li'),b=el('button'),locked=moduleStart(mi)>state.maxUnlocked,done=!!state.passed[mi];b.type='button';b.disabled=locked;b.setAttribute('aria-current',steps[state.current]?.mi===mi?'step':'false');const icon=el('span','mod-icon',done?'✓':String(mi+1).padStart(2,'0'));b.append(icon,el('span','',m.title));b.addEventListener('click',()=>go(moduleStart(mi)));li.append(b);nav.append(li)})}
function moduleStart(mi){let ix=1;for(let i=0;i<mi;i++)ix+=COURSE.modules[i].units.length+1;return ix}
function go(index){if(index<0||index>steps.length-1)return;if(index>state.maxUnlocked){if(index!==state.maxUnlocked+1)return;const current=steps[state.current];if(current?.type==='quiz'&&!state.passed[current.mi])return;state.maxUnlocked=index}state.current=index;state.maxUnlocked=Math.max(state.maxUnlocked,index);state.visited[index]=true;save();render(true)}
function restart(){state=initial();savedAtOpen=0;resumeAvailable=false;save();go(0)}
function welcome(){screen.replaceChildren();screen.append(el('div','eyebrow','Mini-LMS · curso interativo'));screen.append(el('h1','', 'Inteligência Artificial para Marketing Digital'));screen.append(el('p','lead','Uma trilha prática dos fundamentos à aplicação responsável da IA em estratégias de marketing. Avance pelas aulas, responda às perguntas de revisão e acompanhe seu progresso.'));screen.append(el('div','adapted','Objetivos de aprendizagem · adaptação pedagógica baseada no conteúdo do curso'));const objectives=el('div','objectives');[['Compreender','Diferenciar IA generativa, preditiva, analítica e multimodal.'],['Aplicar','Relacionar usos de IA a segmentação, conteúdo, automação e análise.'],['Orientar','Escrever prompts com contexto, tarefa, critérios e formato.'],['Avaliar','Ler métricas e considerar qualidade, ética, privacidade e transparência.']].forEach(([a,b])=>{const c=el('article','objective');c.append(el('b','',a),el('p','',b));objectives.append(c)});screen.append(objectives);const intro=el('div','callout');intro.append(el('strong','','Apresentação do curso'));addParagraphs(intro,COURSE.presentation);screen.append(intro);const box=el('div','saved-box');if(resumeAvailable){box.append(actionButton('Continuar de onde parei','primary',()=>go(Math.min(savedAtOpen,state.maxUnlocked))),actionButton('Reiniciar trilha','',restart))}else box.append(actionButton('Iniciar curso','primary',()=>go(1)));screen.append(box);}
function lesson(step){const m=COURSE.modules[step.mi],u=m.units[step.ui];screen.replaceChildren();screen.append(el('div','eyebrow',`Módulo ${String(step.mi+1).padStart(2,'0')} · Aula ${step.ui+1} de ${m.units.length}`));screen.append(el('h2','',m.title));screen.append(el('h3','',u.title));const body=el('div','lesson-body');u.blocks.forEach(block=>body.append(el(block.kind==='heading'?'h4':'p','',block.text)));screen.append(body);if(step.ui===m.units.length-1){const tip=el('div','callout','Ao concluir este módulo, responda à pergunta de revisão para liberar o próximo.');screen.append(tip)}navigation(step)}
function quiz(step){const mi=step.mi,m=COURSE.modules[mi],q=m.quiz;screen.replaceChildren();screen.append(el('div','eyebrow',`Módulo ${String(mi+1).padStart(2,'0')} · verificação de aprendizagem`));screen.append(el('h2','',`Revisão: ${m.title}`));screen.append(el('p','lead','Escolha uma resposta. Você receberá feedback imediato e poderá tentar novamente.'));const form=el('fieldset','quiz');form.style.border='0';form.style.padding='0';form.append(el('legend','',q.question));const choices=el('div','answers'),answer=state.answers[mi];q.options.forEach((option,i)=>{const label=el('label','answer'),input=document.createElement('input');input.type='radio';input.name='quiz';input.value=String(i);input.checked=answer?.selected===i;input.disabled=!!state.passed[mi];label.append(input,el('span','',option));input.addEventListener('change',()=>selectAnswer(mi,i));choices.append(label)});form.append(choices);screen.append(form);const feedback=el('div','');feedback.id='feedback';feedback.setAttribute('aria-live','polite');if(answer&&answer.selected!==undefined){const correct=answer.selected===q.correct;feedback.className='feedback '+(correct?'good':'try');feedback.textContent=q.feedback[answer.selected]}screen.append(feedback);if(answer&&answer.selected!==undefined&&!state.passed[mi])screen.append(actionButton('Tentar novamente','',()=>{delete state.answers[mi];save();render()}));navigation(step,!state.passed[mi])}
function selectAnswer(mi,index){if(state.firstTry[mi]===undefined)state.firstTry[mi]=index===COURSE.modules[mi].quiz.correct;state.answers[mi]={selected:index};if(index===COURSE.modules[mi].quiz.correct)state.passed[mi]=true;save();render()}
function complete(){screen.replaceChildren();screen.append(el('div','eyebrow','Trilha concluída'));screen.append(el('h2','','Parabéns por concluir o curso!'));screen.append(el('p','lead','Você percorreu os seis módulos, visualizou as aulas e concluiu as verificações de aprendizagem.'));const card=el('div','complete-card');const score=Object.values(state.firstTry).filter(Boolean).length;card.append(el('strong','',`${Math.round(Object.keys(state.visited).length/steps.length*100)}%`),el('p','',`${Object.keys(state.passed).length} de 6 módulos finalizados · ${score} de 6 respostas corretas na primeira tentativa.`));screen.append(card);const checklist=el('div','checklist');['Distinguir os principais tipos e aplicações de IA.','Estruturar instruções e revisar criticamente as respostas.','Medir resultados com KPIs conectados aos objetivos.','Considerar transparência, vieses, veracidade e proteção de dados.'].forEach(t=>{const row=el('div','check');row.append(el('span','', '✓'),el('span','',t));checklist.append(row)});screen.append(checklist);const summary=el('div','callout');summary.append(el('strong','','Síntese do curso'));addParagraphs(summary,COURSE.conclusion);screen.append(summary);const actions=el('div','saved-box');actions.append(actionButton('Reiniciar trilha','primary',restart));screen.append(actions)}
function navigation(step,quizLocked=false){const footer=el('div','screen-actions'),prev=actionButton('← Anterior','',()=>go(state.current-1),state.current===0),right=el('div','actions-right');footer.append(prev);if(step.type==='welcome'){if(state.maxUnlocked===0)right.append(actionButton('Iniciar →','primary',()=>go(1)));}else if(step.type==='complete'){right.append(actionButton('Revisar módulo','primary',()=>go(moduleStart(0))))}else{right.append(actionButton(step.type==='quiz'?'Continuar módulo →':'Continuar →','primary',()=>go(state.current+1),quizLocked))}footer.append(right);screen.append(footer)}
function render(focus=false){renderNav();updateProgress();const step=steps[state.current];if(!step||step.type==='welcome')welcome();else if(step.type==='lesson')lesson(step);else if(step.type==='quiz')quiz(step);else complete();if(focus){const heading=screen.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus()}}}
if(!storageAvailable){document.getElementById('storageNote').hidden=false;document.getElementById('storageNote').textContent='O armazenamento local está indisponível. Seu progresso será mantido apenas enquanto esta página estiver aberta.'}
if(state.current>=steps.length)state.current=0;if(resumeAvailable)state.current=0;state.maxUnlocked=Math.max(state.maxUnlocked,Math.min(savedAtOpen,steps.length-1));state.visited[0]=true;render();
</script></body></html>
